# Once a month, adds newly opened restaurants (and updates hygiene ratings) from the
# Food Standards Agency for every council already in Foodalise.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
name: Monthly restaurant update

on:
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the 1st of each month
  workflow_dispatch: # "Run workflow" button for a manual run

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Only the Supabase client is needed, not the whole app.
      - run: |
          mkdir -p /tmp/fsa && cp scripts/import-fsa.mjs /tmp/fsa/
          cd /tmp/fsa && npm init -y >/dev/null && npm install --no-audit --no-fund @supabase/supabase-js@2
      - run: node /tmp/fsa/import-fsa.mjs --existing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
